<!doctype html>
<html>
  <head>
    <title>PopChoice</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="/assets/fonts/carter_one/stylesheet.css" />
    <link
      rel="stylesheet"
      href="/assets/fonts/roboto-slab-fontface/robotoslab_bold_macroman/stylesheet.css"
    />
    <link
      rel="stylesheet"
      href="/assets/fonts/roboto-slab-fontface/robotoslab_regular_macroman/stylesheet.css"
    />
    <link
      rel="stylesheet"
      href="/assets/fonts/roboto-slab-fontface/robotoslab_light_macroman/stylesheet.css"
    />
  </head>
  <body>
    <header>
      <div class="logo-section">
        <img src="/assets/img/PopChoice-Icon.png" alt="pop-choice" />

        <h1>PopChoice</h1>
      </div>
    </header>

    <div class="question-section">
      <div class="single-question">
        <label for="question-1"> What's your favorite movie and why? </label>
        <br />
        <input type="text" class="input-form" />
      </div>

      <div class="single-question">
        <label for="question-1">
          Are you in the mood for something new or a classic?
        </label>
        <br />
        <input type="text" class="input-form" />
      </div>

      <div class="single-question">
        <label for="question-1">
          Do you wanna have fun or do you want something serious?
        </label>
        <br />
        <input type="text" class="input-form" />
      </div>

      <div class="form-footer">
        <button>Let's Go</button>
      </div>
    </div>

    <div class="answer-section">

      <h2 class="movie-title">School of Rock</h2>

      <p class="movie-description">
        A fun and stupid movie about a wannabe rocker turned fraud substitute
        teacher forming a rock band with his students to win the Battle of the
        Bands
      </p>

      <div class="form-footer">
        <button>Go Again</button>
      </div>

    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
